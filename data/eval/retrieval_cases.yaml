# Retrieval evaluation cases for the current corpus (data/sources/registry.yaml).
#
# STATUS: every case is a DRAFT. They were written by Claude from the extracted texts on 2026-10-09
# and have not been reviewed by a Jordanian trade-law expert. Results computed on them indicate
# relative behaviour between configurations only; they are not validated quality figures.
# To promote a case, a reviewer checks the query wording and the relevant articles against the
# source PDFs and sets review_status: reviewed.
#
# Targets are version-independent (document id + article / treaty paragraph number).
# grade: 2 = directly answers the query, 1 = partially relevant or supporting.

version: 1
description: Bilingual retrieval cases over Law 21/2001, Bylaw 114/2004, Agriculture Law 13/2015 and US-Jordan FTA Annex 2.2.
