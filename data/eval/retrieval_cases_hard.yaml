# Harder retrieval cases (companion to retrieval_cases.yaml).
#
# STATUS: every case is a DRAFT, written by Claude on 2026-10-09 from the extracted texts and not
# reviewed by a domain expert. Results indicate relative behaviour between configurations only.
#
# Tags:
#   paraphrase  - everyday wording that avoids the legal vocabulary of the target article
#   identifier  - lookups by article number, fee amount, HS code or instrument number
#   negative    - the corpus does not cover the question (answerable: false); used to measure how
#                 well top retrieval scores separate answerable from unanswerable questions
#
# Unanswerable cases were chosen for topics outside the four registered instruments (tariff rates,
# JSMO standards, JFDA rules, other trade agreements, tax). They are unanswerable for THIS corpus
# only; they will become answerable once those sources are ingested.

version: 1
description: Paraphrase, identifier and out-of-corpus cases over the four registered sources.
