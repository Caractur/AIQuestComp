<!doctype html>
<html lang="en">
<head>

  <title>MUTABIQ</title>
  <link rel="preload" href="fonts/IBMPlexSans-700-latin.woff2" as="font" type="font/woff2" crossorigin>

<body>

  <header class="site-header">

      <a class="brand" href="#/" data-route-link aria-label="MUTABIQ, overview">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect class="mark-tile" width="40" height="40" rx="10"/>
          <circle class="mark-dot" cx="12" cy="14" r="3"/><rect class="mark-bar" x="18" y="11.5" width="13" height="5" rx="2.5"/>
          <path class="mark-check" d="M10 21.5Q10 27.5 16 27.5H30"/>
        </svg>
        <span class="wordmark">MUTABIQ</span><span class="wordmark-ar" lang="ar" dir="rtl">مُطابِق</span>
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-icon" aria-hidden="true"></span><span class="menu-label">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="#/" data-route-link data-route="home">Overview</a></li>
          <li><a href="#/assessment" data-route-link data-route="assessment">Assessment</a></li>

          <li><a href="#/sources" data-route-link data-route="sources">Knowledge base</a></li>

          <span class="motion-dot" aria-hidden="true"></span><span class="motion-label">Pause motion</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="stage">
    <main id="main" class="route" tabindex="-1">
      <noscript>
        <div class="wrap"><p class="lede">MUTABIQ needs JavaScript to run. The knowledge base is listed in <code>data/sources/registry.yaml</code>.</p></div>
      </noscript>
    </main>
    <div class="cover" aria-hidden="true" hidden>
      <div class="cover-sheet cover-back"></div>
      <div class="cover-sheet cover-front">
        <div class="cover-scene"></div>
        <p class="cover-caption"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p class="footer-brand">
        <svg class="brand-mark small" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect class="mark-tile" width="40" height="40" rx="10"/>
          <circle class="mark-dot" cx="12" cy="14" r="3"/><rect class="mark-bar" x="18" y="11.5" width="13" height="5" rx="2.5"/>
          <path class="mark-check" d="M10 21.5Q10 27.5 16 27.5H30"/>
        </svg>
        <strong>MUTABIQ</strong> · Team ZAA · AI Quest 2026
      </p>
      <p class="footer-note">MUTABIQ prepares the file. The authority makes the decision. Prototype: not legal advice, and the legal status of every source is still unverified.</p>
    </div>
